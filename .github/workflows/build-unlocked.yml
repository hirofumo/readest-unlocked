name: Build unlocked Readest

# Follows readest/readest and publishes an unlocked build of every new upstream
# release, together with the signed updater manifests the app updates itself
# from. The upstream source is never committed here: each run checks the tag out,
# applies tools/unlock.mjs, and builds. See README.md.

on:
  schedule:
    # Daily at 03:00 UTC. Rebuilds only when upstream has a version we have not
    # published yet, so idle days cost one cheap `detect` job.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream ref to build (tag, branch or sha). Empty = latest upstream release tag.'
        required: false
        default: ''
      force:
        description: 'Rebuild even when a release for this version already exists'
        type: boolean
        default: false

permissions:
  contents: read

# Never let two builds publish to the same release concurrently.
concurrency:
  group: build-unlocked
  cancel-in-progress: false

env:
  UPSTREAM_REPO: readest/readest
  # A signing-key rotation sets this repository variable rather than editing the
  # scripts (see TECHNICAL.md §11). Empty — the normal state — means "use the key
  # the scripts carry", which is why they test it with `||` and not `??`: an
  # unset repository variable arrives as an empty string.
  READEST_UNLOCKED_UPDATER_PUBKEY: ${{ vars.READEST_UNLOCKED_UPDATER_PUBKEY }}
  # Husky would install commit hooks that run biome over the patched tree.
  HUSKY: '0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Which version are we building, and do we need to build at all?
  # ---------------------------------------------------------------------------
  detect:
    name: Resolve upstream version
    runs-on: ubuntu-latest
    # `secrets` is not a legal context inside a step `if`, so the availability
    # check is materialised here as a boolean string. Only the boolean is
    # exposed, never the secret itself.
    env:
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      android: ${{ steps.android.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, so the token does not belong in
          # the runner's git config where a dependency lifecycle script could
          # read it and push with this job's `contents: write`.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Resolve the upstream version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_FORCE: ${{ inputs.force }}
        run: node tools/resolve-upstream.mjs

      - name: Check for Android signing secrets
        id: android
        if: env.HAS_ANDROID_KEY == 'true'
        run: echo "android=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## Unlocked Readest build"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| upstream ref | ${{ steps.resolve.outputs.ref }} |"
            echo "| version | ${{ steps.resolve.outputs.version }} |"
            echo "| release tag | ${{ steps.resolve.outputs.tag }} |"
            echo "| build needed | ${{ steps.resolve.outputs.build }} |"
            echo "| android enabled | ${{ steps.android.outputs.android == 'true' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Create the release up front so every build leg only has to upload assets.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare the release
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release when it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          REF: ${{ needs.detect.outputs.ref }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets will be replaced with --clobber."
          else
            NOTES="Automatically built unlocked Readest $VERSION, from $UPSTREAM_REPO at $REF.

          Premium client gates are disabled: third-party cloud sync (WebDAV, S3-compatible bucket, Google Drive, OneDrive, iCloud Drive), per-chapter read-aloud audio download, Audiobookshelf offline downloads, trusted-device pairing, and custom translators with your own API key. Settings also gains a Server URL entry, so the app can be pointed at a self-hosted Readest instead of the official servers.

          Still decided by the upstream service, not unlockable in a client build: Readest Cloud storage quota, daily AI translation quota, and the Send-to-Readest email address.

          Assets are named Readest-<version>-<platform>-<arch or variant>-<type>. Windows, macOS and Linux ship one build per architecture (x64 and arm64 each); Android ships two families (replace and coexist) in four ABIs each — arm64-v8a, armeabi-v7a, x86_64 and x86 — and iOS ships one unsigned arm64 IPA. There is no universal macOS build and no universal Android APK: the Android one was the slowest work in the whole pipeline, and every ABI it covered is published on its own instead. In-app updates come from latest.json for the desktop builds and the replacing Android family, and from latest-coexist.json for the coexisting family. On Android the app asks for the manifest key that matches the device's ABI — android-arm64, android-armv7, android-x86_64 or android-x86 — and each manifest carries all four, so every device is offered the package built for it. The Windows portable download is a zip and does not update itself, and iOS cannot self-update at all — the IPA has to be re-signed with your own Apple ID and reinstalled.

          Readest is AGPL-3.0. These installers are unmodified upstream code plus the patch scripts in this repository. They are not signed by a code-signing certificate, so Windows SmartScreen and macOS Gatekeeper will warn on first launch, and the iOS IPA must be re-signed before it installs."

            gh release create "$TAG" \
              --title "Readest $VERSION (unlocked build)" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi

          # Keep an update path alive while this release is still being built.
          # The app asks releases/latest/download/latest.json, and this release
          # becomes "latest" the moment it is created — so until the manifest job
          # uploads the new one, that URL 404s and every installed app reports an
          # update-check error. Seeding the manifests from the previous release
          # makes the check answer "already the latest version" in the meantime.
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'latest.json'; then
            echo "Manifests are already published on $TAG."
            exit 0
          fi

          previous=$(gh release list --limit 2 --json tagName --jq '.[1].tagName // empty')
          if [ -z "$previous" ]; then
            echo "No earlier release to seed the manifests from; the first check may report an error until this build finishes."
            exit 0
          fi

          mkdir -p seed
          for name in latest.json latest-coexist.json; do
            if gh release download "$previous" --pattern "$name" --dir seed --clobber 2>/dev/null; then
              gh release upload "$TAG" "seed/$name" --clobber
              echo "Seeded $name from $previous"
            fi
          done

  # ---------------------------------------------------------------------------
  # Export the patch itself, so a reviewer can read what changed without reading
  # the script that changed it, next to a provenance summary that names the
  # upstream commit it was applied to.
  #
  # Deliberately absent from `manifest`'s `needs`: a problem here costs one
  # attachment, never anyone's update path.
  # ---------------------------------------------------------------------------
  patch:
    name: Export the patch and provenance
    needs: [detect, prepare]
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out upstream Readest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, so the token does not belong in
          # the runner's git config where a dependency lifecycle script could
          # read it and push with this job's `contents: write`.
          persist-credentials: false
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.ref }}

      - name: Check out the build recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .recipe

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      # `unlock.mjs` only rewrites files, so this job needs no `pnpm install`
      # and reaches a verdict in about a minute instead of competing with the
      # thirteen build legs for a runner.
      - name: Apply the unlock patch
        run: node .recipe/tools/unlock.mjs

      - name: Export the diff and the provenance summary
        env:
          RECIPE_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ needs.detect.outputs.ref }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          git diff > unlock.patch
          changed=$(git diff --name-only | wc -l | tr -d ' ')
          echo "unlock.patch covers $changed file(s), $(wc -l < unlock.patch) line(s)"
          node .recipe/tools/make-build-info.mjs \
            --out BUILD.md \
            --upstream-repo "$UPSTREAM_REPO" \
            --upstream-ref "$REF" \
            --upstream-sha "$(git rev-parse HEAD)" \
            --recipe-repo "$RECIPE_REPO" \
            --recipe-sha "$GITHUB_SHA" \
            --tag "$TAG" \
            --version "$VERSION" \
            --changed-files "$changed" \
            --run-url "$RUN_URL"

      - name: Publish the patch and the provenance summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" unlock.patch BUILD.md --clobber

  # ---------------------------------------------------------------------------
  # Desktop: one matrix leg per platform and architecture. Each leg checks
  # upstream out, patches it, builds and uploads its own artifacts plus their
  # updater signatures.
  #
  # Android is a separate job because `matrix` is not a legal context in a
  # job-level `if` (it is evaluated before the matrix expands), and Android has
  # to be skipped outright when no signing secrets are configured.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.config.name }}
    needs: [detect, prepare]
    if: needs.detect.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows-latest
            name: windows-x64
            release: windows
            arch: x64
            rust_targets: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            bundle_args: '--bundles nsis'
          - os: windows-latest
            name: windows-arm64
            release: windows
            arch: arm64
            rust_targets: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            bundle_args: '--bundles nsis'
          - os: macos-latest
            name: macos-x64
            release: macos
            arch: x64
            rust_targets: x86_64-apple-darwin
            target: x86_64-apple-darwin
            # `app` is requested explicitly: the updater artifact is the .app
            # tarball, and asking for the dmg alone is not guaranteed to run the
            # app bundle target that produces it.
            bundle_args: '--bundles app,dmg'
          - os: macos-latest
            name: macos-arm64
            release: macos
            arch: arm64
            rust_targets: aarch64-apple-darwin
            target: aarch64-apple-darwin
            bundle_args: '--bundles app,dmg'
          - os: ubuntu-22.04
            name: linux-x64
            release: linux
            arch: x64
            rust_targets: x86_64-unknown-linux-gnu
            target: ''
            bundle_args: '--bundles appimage,deb,rpm'
          - os: ubuntu-22.04-arm
            name: linux-arm64
            release: linux
            arch: arm64
            rust_targets: aarch64-unknown-linux-gnu
            target: ''
            bundle_args: '--bundles appimage,deb,rpm'
    runs-on: ${{ matrix.config.os }}
    # The Linux arm64 leg compiles the CEF tauri CLI and the app from scratch on
    # a slower runner, so the ceiling is generous rather than tight.
    timeout-minutes: 240
    permissions:
      contents: write
    # No secret is a job-level `env` here: a job-level env reaches every step of
    # the job, including the ones that run dependency lifecycle scripts
    # (`pnpm install`, `cargo install`). The updater private key is scoped to the
    # steps that actually run `tauri build`, which are the only ones that sign.
    # Windows runners default to pwsh; every run script in this job is bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out upstream Readest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, so the token does not belong in
          # the runner's git config where a dependency lifecycle script could
          # read it and push with this job's `contents: write`.
          persist-credentials: false
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.ref }}

      - name: Initialize the submodules
        run: git submodule update --init --recursive

      - name: Check out the build recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, so the token does not belong in
          # the runner's git config where a dependency lifecycle script could
          # read it and push with this job's `contents: write`.
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .recipe

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.config.rust_targets }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # One cache per leg, named after the leg, so each entry has exactly one
          # writer. macOS used to share a single entry written by the universal
          # leg, whose target held both triples and therefore covered the thin
          # legs too; that leg is gone, so the two macOS legs now own their own
          # entries — sharing one would leave whichever leg does not write it
          # compiling cold on every release. Cost and the 10 GB budget: see
          # TECHNICAL.md §6.
          key: ${{ format('{0}-cargo', matrix.config.name) }}

      # The npm cli-cef bundles the AppImage with a broken quick-sharun fork.
      # Build the CLI from readest/tauri instead; rev-pinned, and the marker
      # skips the rebuild while rust-cache keeps ~/.cargo/bin.
      - name: Install the CEF tauri CLI (Linux)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          rev=6beeb209b5514f597a26f48b7a5b9fe4c59b5f12
          marker="$HOME/.cargo/bin/.cargo-tauri-rev"
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ] && [ "$(cat "$marker" 2>/dev/null)" = "$rev" ]; then
            echo "cargo-tauri at $rev already installed"
            exit 0
          fi
          cargo install tauri-cli --git https://github.com/readest/tauri --rev "$rev" --locked --force
          echo "$rev" > "$marker"

      - name: Install Linux build dependencies (Linux)
        if: matrix.config.release == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 libappindicator3-dev librsvg2-dev patchelf xdg-utils zip

      # Chromium dlopens NSS, libpulse and libspeechd by soname; whatever the
      # bundle lacks comes from the host and breaks against the bundled glibc.
      # Stage them where the bundler picks them up.
      - name: Stage the CEF AppImage runtime libraries (Linux)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y libnss3 libpulse0 libspeechd2 libxkbcommon-x11-0
          nss_dir=$(dirname "$(ls /usr/lib/*-linux-gnu/nss/libsoftokn3.so)")
          lib_dir=${nss_dir%/nss}
          sudo cp -f --remove-destination "$nss_dir"/*.so "$lib_dir/"
          conf=apps/readest-app/src-tauri/tauri.conf.json
          jq --arg d "$lib_dir" '.bundle.linux.appimage.files += {
              "/usr/lib/libspeechd.so.2": ($d + "/libspeechd.so.2"),
              "/usr/lib/libxkbcommon-x11.so.0": ($d + "/libxkbcommon-x11.so.0")
            }' "$conf" > "$conf.tmp" && mv "$conf.tmp" "$conf"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply the unlock patch
        run: node .recipe/tools/unlock.mjs

      - name: Verify the patch (sources)
        run: node .recipe/tools/verify.mjs

      # Snapshot the patched tree. Some upstream build steps run `git checkout .`
      # to undo generated files; committing first makes that restore the patch
      # instead of reverting it.
      - name: Snapshot the patched tree
        run: |
          git config user.email "ci@readest-unlocked.invalid"
          git config user.name "readest-unlocked ci"
          # The recipe checkout sits inside this workspace; keep it out of the
          # snapshot commit so the diff stays the patch and nothing else.
          echo ".recipe/" >> .git/info/exclude
          git add -A
          git commit -m "chore: apply unlocked-build patch" --no-verify

      - name: Stage the pdf.js vendor assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # scripts/tauri.mjs runs `cargo tauri` (the CLI built above) and adds
          # --features cef on this platform.
          TAURI_CEF_CARGO: ${{ matrix.config.release == 'linux' && '1' || '0' }}
          STRACE_MODE: '0'
          # This is where every updatable desktop artifact is signed, so the key
          # is scoped to this step rather than the whole job.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm tauri build ${{ matrix.config.target && format('--target {0} ', matrix.config.target) || '' }}${{ matrix.config.bundle_args }}

      # The sources look right; prove the artifact is right too. Runs on the
      # `out/` tree the frontend build just produced.
      - name: Verify the patch (built bundle)
        run: node .recipe/tools/check-bundle.mjs

      # Stage the installer before the portable rebuild below: that rebuild
      # regenerates the same nsis output with NEXT_PUBLIC_PORTABLE_APP=true
      # baked into the frontend, and an installed app must not carry the
      # portable flag.
      - name: Stage the Windows installer (Windows)
        if: matrix.config.release == 'windows'
        run: |
          set -euo pipefail
          nsis="target/${{ matrix.config.target }}/release/bundle/nsis"
          cp "$(ls "$nsis"/*-setup.exe | head -n 1)" windows-setup.exe
          cp "$(ls "$nsis"/*-setup.exe.sig | head -n 1)" windows-setup.exe.sig

      - name: Build the portable executable (Windows)
        if: matrix.config.release == 'windows'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # The rebuild regenerates the nsis output, which tauri signs, so this
          # step needs the key too.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          echo "NEXT_PUBLIC_PORTABLE_APP=true" >> .env.local
          pnpm tauri build --target ${{ matrix.config.target }} ${{ matrix.config.bundle_args }}

      # The rebuild above rewrote `out/` with NEXT_PUBLIC_PORTABLE_APP baked in,
      # and the assertion that ran earlier checked the *previous* bundle. A
      # portable build that lost the marker would ship a locked app, so the
      # assertion runs again against what this build actually produced.
      - name: Verify the patch (portable bundle)
        if: matrix.config.release == 'windows'
        run: node .recipe/tools/check-bundle.mjs

      - name: Upload the Windows artifacts (Windows)
        if: matrix.config.release == 'windows'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          setup="Readest-${VERSION}-windows-${{ matrix.config.arch }}-setup.exe"
          portable="Readest-${VERSION}-windows-${{ matrix.config.arch }}-portable.zip"

          mv windows-setup.exe "$setup"
          mv windows-setup.exe.sig "$setup.sig"

          # The portable download is a zip. It is deliberately not signed and not
          # listed in the updater manifest: the updater downloads an entry and
          # launches it as an executable, which a zip cannot satisfy, so the
          # portable variant is updated by downloading a new zip by hand.
          cp "target/${{ matrix.config.target }}/release/readest.exe" readest-portable.exe
          powershell -NoProfile -Command "Compress-Archive -Path 'readest-portable.exe' -DestinationPath '$portable' -Force"
          rm -f readest-portable.exe

          gh release upload "$TAG" "$setup" "$setup.sig" "$portable" --clobber

      - name: Upload the macOS artifacts (macOS)
        if: matrix.config.release == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.config.target }}/release/bundle"
          dmg="Readest-${VERSION}-macos-${{ matrix.config.arch }}.dmg"
          cp "$(ls "$bundle"/dmg/*.dmg | head -n 1)" "$dmg"
          gh release upload "$TAG" "$dmg" --clobber

          # The macOS updater artifact is the .app tarball, not the dmg.
          tarball=$(ls "$bundle"/macos/*.app.tar.gz 2>/dev/null | head -n 1 || true)
          if [ -z "$tarball" ]; then
            echo "::error::no .app.tar.gz updater archive was produced; this macOS build cannot be updated in place"
            exit 1
          fi
          updater="Readest-${VERSION}-macos-${{ matrix.config.arch }}-updater.tar.gz"
          cp "$tarball" "$updater"
          cp "$tarball.sig" "$updater.sig"
          gh release upload "$TAG" "$updater" "$updater.sig" --clobber

      - name: Upload the Linux artifacts (Linux)
        if: matrix.config.release == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          bundle=target/release/bundle
          arch="${{ matrix.config.arch }}"
          echo "bundle contents:"
          find "$bundle" -maxdepth 2 -type f | sort

          # The Linux updater artifact is the AppImage itself, signed in place —
          # the app downloads it, chmods it and launches it, and upstream's
          # manifest points both linux-<arch> and linux-<arch>-appimage at it.
          # Tauri names the signature after the file it signed, so the pair is
          # taken from the source path rather than looked up under the published
          # name.
          appimage_src=$(ls "$bundle"/appimage/*.AppImage | head -n 1)
          if [ ! -f "$appimage_src.sig" ]; then
            echo "::error::no signature next to $appimage_src; this build could not be updated in place"
            exit 1
          fi

          appimage="Readest-${VERSION}-linux-${arch}.AppImage"
          cp "$appimage_src" "$appimage"
          cp "$appimage_src.sig" "$appimage.sig"
          cp "$(ls "$bundle"/deb/*.deb | head -n 1)" "Readest-${VERSION}-linux-${arch}.deb"
          cp "$(ls "$bundle"/rpm/*.rpm | head -n 1)" "Readest-${VERSION}-linux-${arch}.rpm"

          gh release upload "$TAG" \
            "$appimage" "$appimage.sig" \
            "Readest-${VERSION}-linux-${arch}.deb" \
            "Readest-${VERSION}-linux-${arch}.rpm" \
            --clobber

  # ---------------------------------------------------------------------------
  # Android: skipped outright until the signing secrets exist. Builds two
  # families — one that replaces the official app, one that installs beside it —
  # in four ABIs each: the two device ones (arm64-v8a, armeabi-v7a) and the two
  # emulator ones (x86_64, x86).
  #
  # There is deliberately no universal APK: it was the long pole of the whole
  # release (31–40 minutes against 12–16 for a single ABI, because it compiles
  # every ABI in one job), and the ABIs it covered are now published on their own.
  # What that costs is on the client side and is written down in README §Android:
  # the app asks for `android-arm64` on 64-bit ARM and `android-universal`
  # otherwise, so non-arm64 devices get their updates from Obtainium or by hand.
  # ---------------------------------------------------------------------------
  build_android:
    name: Build android (${{ matrix.family }}, ${{ matrix.variant }})
    needs: [detect, prepare]
    if: needs.detect.outputs.build == 'true' && needs.detect.outputs.android == 'true'
    strategy:
      fail-fast: false
      matrix:
        # One job per artifact. The two families are the same sources with
        # different application ids, and every APK is an independent Gradle
        # build, so running them side by side keeps each leg at the cost of one
        # ABI instead of the sum of them.
        family: [replace, coexist]
        variant: [arm64-v8a, armeabi-v7a, x86_64, x86]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    # Same rule as the desktop job: the key is not a job-level env, because the
    # steps before the build run upstream dependency lifecycle scripts.
    steps:
      - name: Check out upstream Readest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, so the token does not belong in
          # the runner's git config where a dependency lifecycle script could
          # read it and push with this job's `contents: write`.
          persist-credentials: false
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.ref }}

      - name: Initialize the submodules
        run: git submodule update --init --recursive

      - name: Check out the build recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, so the token does not belong in
          # the runner's git config where a dependency lifecycle script could
          # read it and push with this job's `contents: write`.
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .recipe

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install the Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: android-cargo
          # Both families build the same triples from the same sources, so one
          # writer is enough and the other save would be rejected as a duplicate.
          save-if: ${{ matrix.family == 'replace' }}

      # `tauri android init` regenerates the Gradle project every run, so the
      # wrapper distribution and the dependency cache are what make later runs
      # fast. Both Android legs share one entry, and the key deliberately does
      # not carry the upstream version: a per-version key would leave a stale
      # copy behind on every release and eat into the repository's cache budget.
      - name: Cache Gradle
        # Pinned like every other action in this workflow — it is the one that
        # runs beside the signing key and this job's `contents: write`. The line
        # is still v4: v5/v6 are a behaviour change that deserves its own
        # evaluation rather than being smuggled into a pinning commit.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}
          restore-keys: |
            gradle-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply the unlock patch
        run: node .recipe/tools/unlock.mjs

      - name: Verify the patch (sources)
        run: node .recipe/tools/verify.mjs

      # `tauri android init` and `icon` dirty tracked files and upstream undoes
      # that with `git checkout .`; committing first makes that restore the patch
      # (and, for the second family below, the coexist identity) instead of
      # reverting it.
      - name: Snapshot the patched tree
        run: |
          git config user.email "ci@readest-unlocked.invalid"
          git config user.name "readest-unlocked ci"
          echo ".recipe/" >> .git/info/exclude
          git add -A
          git commit -m "chore: apply unlocked-build patch" --no-verify

      - name: Stage the pdf.js vendor assets
        run: pnpm --filter @readest/readest-app setup-vendors

      # Second family: same code, its own application id, so it can be installed
      # next to the official app instead of replacing it. The label stays
      # "Readest" — only the About dialog tells the two apart.
      - name: Switch to the coexisting identity
        if: matrix.family == 'coexist'
        run: |
          set -euo pipefail
          node .recipe/tools/coexist.mjs
          git add -A
          git commit -m "chore: switch to the coexisting Android identity" --no-verify

      - name: Initialize the Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          # Upstream tracks part of gen/android, so this checkout is what keeps
          # their Android customisations — and, for the coexisting family, what
          # puts the original package id back. The rewrite below re-points that
          # committed project at the family being built.
          git checkout .
          cd ../..
          if [ "${{ matrix.family }}" = "coexist" ]; then
            node .recipe/tools/coexist-android.mjs
          fi
          bash .recipe/helpers/android-keystore.sh

      # One build per job, each one targeting a single ABI. They all write the
      # same app-universal-release.apk path — "universal" there is the Gradle
      # flavor, not a multi-ABI package — which is why each job reads the file
      # straight after its own build.
      - name: Build the APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          NODE_OPTIONS: --max-old-space-size=8192
          # `tauri android build` is what produces the signed updater artifacts
          # for this variant, so the key is scoped here and to the `signer sign`
          # step below instead of the whole job.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

          # The CLI's target names are the rustc arch, not the ABI directory
          # name: i686 is the one that lands in lib/x86/.
          case "${{ matrix.variant }}" in
            arm64-v8a)   pnpm tauri android build -t aarch64 ;;
            armeabi-v7a) pnpm tauri android build -t armv7 ;;
            x86_64)      pnpm tauri android build -t x86_64 ;;
            x86)         pnpm tauri android build -t i686 ;;
            *) echo "::error::unknown variant ${{ matrix.variant }}"; exit 1 ;;
          esac

          cp "$apk" "../../android-${{ matrix.family }}-${{ matrix.variant }}.apk"
          echo "staged android-${{ matrix.family }}-${{ matrix.variant }}.apk <- $apk"

      - name: Verify the patch (built bundle)
        run: node .recipe/tools/check-bundle.mjs

      # The ABI check above reads the APK too, for a different question. These
      # are the two things a file name cannot be trusted about: a coexist APK
      # that actually carries the replacing application id — which is what a
      # reordered `git checkout .` would produce — and an unsigned APK, which
      # is what Gradle produces when it never sees keystore.properties.
      - name: Verify the APK identity (Android)
        env:
          FAMILY: ${{ matrix.family }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          apk="android-${FAMILY}-${VARIANT}.apk"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "using build-tools: $build_tools"

          case "$FAMILY" in
            replace) want=com.bilingify.readest ;;
            coexist) want=com.hirofumo.readest.unlocked ;;
            *) echo "::error::unknown family $FAMILY"; exit 1 ;;
          esac

          pkg=$("$build_tools/aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
          if [ "$pkg" != "$want" ]; then
            echo "::error::$apk declares $pkg, expected $want"
            exit 1
          fi
          echo "$apk declares $pkg"

          # `tauri android build` does not sign the APK itself — the upload step
          # signs for the updater. This is a different signature: the Android
          # one, which decides whether the APK installs at all.
          if ! "$build_tools/apksigner" verify --print-certs "$apk" > apk-certs.txt 2>&1; then
            echo "::error::$apk is not signed by the Android keystore"
            cat apk-certs.txt
            exit 1
          fi
          {
            echo "### $apk"
            echo '```'
            grep -iE 'Signer #1 certificate (DN|SHA-256)' apk-certs.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          # `pnpm tauri signer sign` runs at the end of this step.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          family="${{ matrix.family }}"
          variant="${{ matrix.variant }}"
          apk="Readest-${VERSION}-android-${family}-${variant}.apk"
          mv "android-${family}-${variant}.apk" "$apk"

          # Read the ABIs out of the APK rather than trusting its name or size.
          # A wrong-variant or mis-staged APK used to be publishable because
          # nothing looked inside the file.
          abis=$(unzip -l "$apk" | grep -oE 'lib/[^/]+/' | sed 's#lib/##; s#/##' | sort -u | tr '\n' ' ')
          echo "ABIs in $apk: ${abis:-none}"
          # Every APK carries exactly one ABI, and the variant name is that ABI's
          # directory name — including x86 and x86_64, whose CLI target names
          # differ (i686).
          if [ "$abis" != "$variant " ]; then
            echo "::error::$apk should contain only $variant, found: ${abis:-none}"
            exit 1
          fi

          # Tauri does not sign the APKs itself; upstream signs them explicitly
          # and so does this workflow, because the updater verifies them.
          (cd apps/readest-app && pnpm tauri signer sign "../../$apk")
          gh release upload "$TAG" "$apk" "$apk.sig" --clobber

  # ---------------------------------------------------------------------------
  # iOS: one unsigned, arm64-only IPA. No Apple certificate is configured for
  # this repository, so the package is honestly unsigned — the user re-signs it
  # with their own Apple ID before it installs. That is also why this leg has no
  # secret to gate on: the only thing it needs from `detect` is whether this
  # version has to be built at all.
  #
  # The Tauri updater does not support iOS, so this artifact carries no .sig and
  # deliberately does not appear in latest.json / latest-coexist.json. See
  # TECHNICAL.md §7 and §13.
  # ---------------------------------------------------------------------------
  build_ios:
    name: Build ios (arm64)
    needs: [detect, prepare]
    if: needs.detect.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 240
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out upstream Readest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, so the token does not belong in
          # the runner's git config where a dependency lifecycle script could
          # read it and push with this job's `contents: write`.
          persist-credentials: false
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.ref }}

      - name: Initialize the submodules
        run: git submodule update --init --recursive

      - name: Check out the build recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, so the token does not belong in
          # the runner's git config where a dependency lifecycle script could
          # read it and push with this job's `contents: write`.
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .recipe

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Device builds only: the IPA is re-signed by the user, who can do
          # nothing with a simulator bundle.
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # No other leg builds the iOS triple, so this entry has exactly one
          # writer without a `save-if` guard. It costs roughly another 1.4 GB
          # against a repository cache budget that is already slightly past
          # 10 GB — the alternative is a cold iOS Rust compile on every release
          # (see TECHNICAL.md §6, "cache budget").
          key: ios-cargo

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply the unlock patch
        run: node .recipe/tools/unlock.mjs

      - name: Verify the patch (sources)
        run: node .recipe/tools/verify.mjs

      # Same reason as the other legs: some upstream build steps run
      # `git checkout .` to undo files they generated, and committing first
      # makes that restore the patch instead of reverting it.
      - name: Snapshot the patched tree
        run: |
          git config user.email "ci@readest-unlocked.invalid"
          git config user.name "readest-unlocked ci"
          # The recipe checkout sits inside this workspace; keep it out of the
          # snapshot commit so the diff stays the patch and nothing else.
          echo ".recipe/" >> .git/info/exclude
          git add -A
          git commit -m "chore: apply unlocked-build patch" --no-verify

      - name: Stage the pdf.js vendor assets
        run: pnpm --filter @readest/readest-app setup-vendors

      # `tauri ios init` runs xcodegen, which the macOS runner image does not
      # ship. brew is idempotent: on an image that already has xcodegen this is
      # a no-op.
      - name: Install xcodegen
        run: brew install xcodegen

      # Upstream force-tracks 16 files under gen/apple, but the Xcode project it
      # ships also needs files upstream never committed: Sources/Readest/main.mm
      # (+ bindings/bindings.h), LaunchScreen.storyboard, Assets.xcassets,
      # assets/ and both generated Info.plists. `tauri ios build` reads
      # gen/apple/Readest_iOS/Info.plist as an *input* — tauri-cli merges it into
      # the app plist — so a fresh checkout cannot build iOS at all.
      #
      # Deleting gen/apple first is what makes the CLI render its own template
      # project.yml, whose `info:` block is what makes xcodegen write that
      # missing plist. Upstream's own project.yml uses INFOPLIST_FILE instead,
      # so it never generates one.
      - name: Generate the iOS project
        run: |
          set -euo pipefail
          cd apps/readest-app

          rm -rf src-tauri/gen/apple
          env -u FORCE_COLOR pnpm tauri ios init --skip-targets-install

          # Real icons into the asset catalog the template just created.
          pnpm tauri icon ../../data/icons/readest-book.png

          # Put upstream's committed gen/apple files back: project.yml,
          # project.pbxproj and the hand-tracked extension sources and
          # entitlements. Everything generated above is untracked and ignored,
          # so it survives this.
          git checkout .

          # Second pass, this time with upstream's own project.yml: that is what
          # generates ReadestWidget/Info.plist, which the committed project file
          # references and upstream never committed. The project file this pass
          # writes is discarded by the checkout below, so the build keeps using
          # the pbxproj upstream ships (TECHNICAL.md §14 explains both passes).
          #
          # FORCE_COLOR stays out of both xcodegen runs: xcodegen expands
          # `${FORCE_COLOR}` from the generating shell and bakes the literal
          # value into the "Build Rust Code" script phase, which upstream
          # documents in apps/readest-app/scripts/release-ios-appstore.sh.
          ( cd src-tauri/gen/apple && env -u FORCE_COLOR xcodegen generate )
          git checkout .

          # Fail loudly and cheaply, before the expensive compile, when the
          # scaffold the committed project depends on is incomplete.
          for f in project.yml \
                   Sources/Readest/main.mm \
                   Sources/Readest/bindings/bindings.h \
                   LaunchScreen.storyboard \
                   Assets.xcassets/Contents.json \
                   Readest_iOS/Info.plist \
                   ReadestWidget/Info.plist \
                   Readest.xcodeproj/project.pbxproj; do
            if [ ! -e "src-tauri/gen/apple/$f" ]; then
              echo "::error::the iOS scaffold is missing src-tauri/gen/apple/$f"
              exit 1
            fi
          done
          if ! compgen -G "src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/*.png" > /dev/null; then
            echo "::error::no iOS app icons were generated"
            exit 1
          fi

          echo "iOS scaffold:"
          ( cd src-tauri/gen/apple && find . -maxdepth 2 | sort )

      # `--no-sign` is what makes an IPA buildable without an Apple
      # certificate: it archives with code signing disabled and zips the .app
      # into Payload/ itself (tauri-cli >= 2.11.0, and this workspace pins
      # 2.11.4). No TAURI_SIGNING_PRIVATE_KEY here on purpose — the iOS path
      # produces no updater artifact to sign.
      - name: Build the IPA
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm tauri ios build --no-sign

      # The sources look right; prove the artifact is right too. The unlock
      # marker is grepped here rather than in the IPA below because the frontend
      # is brotli-compressed into the Rust static library, so it is not
      # searchable inside the package.
      - name: Verify the patch (built bundle)
        run: node .recipe/tools/check-bundle.mjs

      - name: Verify the IPA
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=(apps/readest-app/src-tauri/gen/apple/build/*/Readest.ipa)
          # Expand the array only after proving it has one element: macOS ships
          # bash 3.2, where `${arr[@]}` on an empty array trips `set -u` before
          # the error message below could be printed.
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::expected exactly one IPA under gen/apple/build/*/Readest.ipa, found ${#found[@]}"
            ls -lR apps/readest-app/src-tauri/gen/apple/build || true
            exit 1
          fi
          ipa="${found[0]}"
          case "$ipa" in
            */build/arm64/Readest.ipa) ;;
            *) echo "::error::unexpected IPA path: $ipa"; exit 1 ;;
          esac

          work=$(mktemp -d)
          unzip -q "$ipa" -d "$work"
          app="$work/Payload/Readest.app"
          if [ ! -d "$app" ]; then
            echo "::error::$ipa does not contain Payload/Readest.app"
            exit 1
          fi

          exe=$(plutil -extract CFBundleExecutable raw "$app/Info.plist")
          bundle_id=$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")
          short_version=$(plutil -extract CFBundleShortVersionString raw "$app/Info.plist")

          if [ "$bundle_id" != "com.bilingify.readest" ]; then
            echo "::error::$ipa declares $bundle_id, expected com.bilingify.readest"
            exit 1
          fi
          if [ "$short_version" != "$VERSION" ]; then
            echo "::error::$ipa carries CFBundleShortVersionString $short_version, expected $VERSION"
            exit 1
          fi

          arches=$(lipo -archs "$app/$exe")
          if [ "$arches" != "arm64" ]; then
            echo "::error::$ipa is built for '$arches', expected arm64 only"
            exit 1
          fi

          for appex in ReadestWidget ShareExtension; do
            if [ ! -d "$app/PlugIns/$appex.appex" ]; then
              echo "::error::$ipa is missing PlugIns/$appex.appex"
              exit 1
            fi
          done

          # It has to stay unsigned: there is no Apple certificate in this
          # repository, and documenting "unsigned" while shipping a signature
          # nobody can verify would be worse than an honestly unsigned package.
          if [ -e "$app/_CodeSignature" ]; then
            echo "::error::$ipa carries a code signature; it is not supposed to be signed"
            exit 1
          fi

          {
            echo "### $(basename "$ipa")"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| bundle id | \`$bundle_id\` |"
            echo "| version | \`$short_version\` |"
            echo "| executable | \`$exe\` ($arches) |"
            echo "| signed | no |"
            echo "| size | $(du -h "$ipa" | cut -f 1) |"
            echo ""
            echo '```'
            unzip -l "$ipa" | head -n 15
            echo '```'
            echo ""
            echo "xcodebuild: $(xcodebuild -version | tr '\n' ' ')"
            echo ""
            echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
            echo ""
            echo '```'
            df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the iOS artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          ipa="Readest-${VERSION}-ios-arm64.ipa"
          cp apps/readest-app/src-tauri/gen/apple/build/arm64/Readest.ipa "$ipa"
          ls -l "$ipa"
          # No .sig next to it, on purpose: the Tauri updater does not support
          # iOS, so this is not an update target and must not reach
          # latest.json. A newer IPA is installed the same way this one is.
          gh release upload "$TAG" "$ipa" --clobber

  # ---------------------------------------------------------------------------
  # The app updates itself from these manifests, so they are assembled only once
  # every leg has uploaded its signatures. A manifest missing a platform key
  # means that platform is simply not offered an update, which the run summary
  # reports.
  # ---------------------------------------------------------------------------
  manifest:
    name: Publish updater manifests
    # `build_ios` is in here even though the IPA carries no signature: this job
    # is also where SHA256SUMS and the attestation are produced, and both are
    # built from the release's asset list — waiting for iOS is what puts the IPA
    # in them.
    needs: [detect, prepare, build, build_android, build_ios]
    # `always()` is required: without a status function GitHub implicitly ANDs a
    # success() check over every needed job, so one failed platform would skip
    # the manifest outright and leave every other platform with no update path.
    # Gating on `prepare` is deliberate — once the release exists, the manifest
    # is assembled from whatever signatures landed, and a platform whose
    # signature is missing is reported rather than taking the rest down with it.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Attestations need `id-token` to mint a short-lived Sigstore certificate
      # and `attestations` to store the resulting record. Scoped to this job —
      # the workflow-level default stays `contents: read`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, so the token does not belong in
          # the runner's git config where a dependency lifecycle script could
          # read it and push with this job's `contents: write`.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      # `gh release upload --clobber` replaces an asset by name and never removes
      # one, so a renamed or retired asset would stay on the release, still
      # downloadable, with the manifests knowing nothing about it. The expected
      # names are written out in the tool, and this runs before anything new is
      # stamped over the release: an unexpected asset fails the run instead of
      # being silently blessed by a fresh SHA256SUMS and attestation.
      - name: Assert the release's asset set
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: node tools/check-release-assets.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" --version "$VERSION"

      - name: Download the signature files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p sigs
          gh release download "$TAG" --pattern '*.sig' --dir sigs --clobber
          ls -1 sigs

      - name: Build the manifests
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          node tools/make-manifest.mjs --dir sigs --version "$VERSION" --variant replace --out latest.json
          node tools/make-manifest.mjs --dir sigs --version "$VERSION" --variant coexist --out latest-coexist.json

      - name: Publish the manifests and the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          REF: ${{ needs.detect.outputs.ref }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" latest.json latest-coexist.json --clobber

          # The "recent updates" view reads this file; upstream's own copy is
          # versioned with the code, so serve that one.
          url="https://raw.githubusercontent.com/$UPSTREAM_REPO/$REF/apps/readest-app/release-notes.json"
          if curl -fsSL "$url" -o release-notes.json; then
            gh release upload "$TAG" release-notes.json --clobber
          else
            echo "::warning::could not fetch release-notes.json from $url"
          fi

      - name: Build SHA256SUMS from the release digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          # GitHub keeps a sha256 for every uploaded asset and returns it from
          # the release API, so the checksums cost one call, not a ~2 GB download.
          node tools/make-checksums.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" --out SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber

      # Proves the artifacts came out of this workflow, in this repository, at
      # the commit the run is pinned to. `subject-checksums` is read as a *file*:
      # actions/attest parses name+digest out of it and never opens the artifacts
      # themselves, which is what keeps this step free.
      - name: Attest the release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      # A release tag is created once, with the first build of a version, and
      # `gh release create --target` is ignored from then on — so after a rebuild
      # the release would still link to whatever commit published it first. Point
      # it at this run instead. Being the last step is deliberate: the pointer
      # only follows a run that got all the way through publishing the manifests,
      # the checksums and the provenance that now describe the release. BUILD.md,
      # uploaded by this same run, records the same commit.
      - name: Point the release tag at this run's commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "$TAG already points at $GITHUB_SHA"
          elif [ -z "$current" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
            echo "Created $TAG at $GITHUB_SHA"
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
            echo "Moved $TAG from $current to $GITHUB_SHA"
          fi

          # The release record carries its own target_commitish hint from creation
          # time, and moving the tag does not update it, so an API query would tell
          # a different story from the release page. Keep the two equal.
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f target_commitish="$GITHUB_SHA" > /dev/null

          {
            echo ""
            echo "| release tag | now points at |"
            echo "| --- | --- |"
            echo "| \`$TAG\` | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  summary:
    name: Summary
    needs: [detect, build, build_android, build_ios, manifest, patch]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only for the failure report below; nothing else in this job writes.
      issues: write
    steps:
      # Checked out so the failure report can use the shared script, which keeps
      # this job's de-duplication identical to the preflight workflow's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          BUILD: ${{ needs.detect.outputs.build }}
          DESKTOP: ${{ needs.build.result }}
          ANDROID: ${{ needs.build_android.result }}
          IOS: ${{ needs.build_ios.result }}
          MANIFEST: ${{ needs.manifest.result }}
          PATCH: ${{ needs.patch.result }}
        run: |
          {
            echo "## Result"
            echo ""
            if [ "$BUILD" != "true" ]; then
              echo "Upstream has not published a new version since the last release; nothing was built."
            else
              echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
              echo ""
              echo "| leg | result |"
              echo "| --- | --- |"
              echo "| desktop matrix | $DESKTOP |"
              echo "| android | $ANDROID |"
              echo "| ios | $IOS |"
              echo "| updater manifests | $MANIFEST |"
              echo "| patch export | $PATCH |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The reason this job carries `always()`: a failed run has to say so
      # somewhere a person actually looks. `skipped` is not a failure here — the
      # Android job is skipped whenever the signing secrets are absent, which is
      # a supported configuration rather than a problem.
      - name: Open or update the failure issue
        if: >-
          needs.detect.outputs.build == 'true' &&
          (contains(fromJSON('["failure","cancelled"]'), needs.build.result) ||
           contains(fromJSON('["failure","cancelled"]'), needs.build_android.result) ||
           contains(fromJSON('["failure","cancelled"]'), needs.build_ios.result) ||
           contains(fromJSON('["failure","cancelled"]'), needs.manifest.result) ||
           contains(fromJSON('["failure","cancelled"]'), needs.patch.result))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          DESKTOP: ${{ needs.build.result }}
          ANDROID: ${{ needs.build_android.result }}
          IOS: ${{ needs.build_ios.result }}
          MANIFEST: ${{ needs.manifest.result }}
          PATCH: ${{ needs.patch.result }}
        run: |
          set -euo pipefail
          body="The build for **${TAG}** did not finish cleanly.

          | leg | result |
          | --- | --- |
          | desktop matrix | ${DESKTOP} |
          | android | ${ANDROID} |
          | ios | ${IOS} |
          | updater manifests | ${MANIFEST} |
          | patch export | ${PATCH} |

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          A failed leg does not push anyone a broken update: the manifests are
          assembled from whatever signatures landed, and a platform whose
          signature is missing is simply not offered that version.

          For a transient failure — a download that failed, or an API error in an
          upload step — re-run only the failed jobs:

          \`gh run rerun ${GITHUB_RUN_ID} --failed\`

          GitHub re-runs the dependent manifest and summary jobs with them, so
          the checksums, the manifests and the attestation are rebuilt from what
          the release actually holds. Reach for \`force=true\` only when the cause
          needs a rebuild: a change to the recipe, or an artifact that has to be
          produced again."

          node tools/report-failure.mjs \
            --title "Build failure: unlocked Readest ${VERSION}" \
            --body "$body" \
            --label build-failure
