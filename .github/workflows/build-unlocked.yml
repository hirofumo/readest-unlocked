name: Build unlocked Readest

# Follows readest/readest and publishes an unlocked build of every new upstream
# release, together with the signed updater manifests the app updates itself
# from. The upstream source is never committed here: each run checks the tag out,
# applies tools/unlock.mjs, and builds. See README.md.

on:
  schedule:
    # Daily at 03:00 UTC. Rebuilds only when upstream has a version we have not
    # published yet, so idle days cost one cheap `detect` job.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream ref to build (tag, branch or sha). Empty = latest upstream release tag.'
        required: false
        default: ''
      force:
        description: 'Rebuild even when a release for this version already exists'
        type: boolean
        default: false

permissions:
  contents: read

# Never let two builds publish to the same release concurrently.
concurrency:
  group: build-unlocked
  cancel-in-progress: false

env:
  UPSTREAM_REPO: readest/readest
  # Husky would install commit hooks that run biome over the patched tree.
  HUSKY: '0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Which version are we building, and do we need to build at all?
  # ---------------------------------------------------------------------------
  detect:
    name: Resolve upstream version
    runs-on: ubuntu-latest
    # `secrets` is not a legal context inside a step `if`, so the availability
    # check is materialised here as a boolean string. Only the boolean is
    # exposed, never the secret itself.
    env:
      HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      android: ${{ steps.android.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Resolve the upstream version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_FORCE: ${{ inputs.force }}
        run: node tools/resolve-upstream.mjs

      - name: Check for Android signing secrets
        id: android
        if: env.HAS_ANDROID_KEY == 'true'
        run: echo "android=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## Unlocked Readest build"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| upstream ref | ${{ steps.resolve.outputs.ref }} |"
            echo "| version | ${{ steps.resolve.outputs.version }} |"
            echo "| release tag | ${{ steps.resolve.outputs.tag }} |"
            echo "| build needed | ${{ steps.resolve.outputs.build }} |"
            echo "| android enabled | ${{ steps.android.outputs.android == 'true' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Create the release up front so every build leg only has to upload assets.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare the release
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release when it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          REF: ${{ needs.detect.outputs.ref }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets will be replaced with --clobber."
            exit 0
          fi

          NOTES="Automatically built unlocked Readest $VERSION, from $UPSTREAM_REPO at $REF.

          Premium client gates are disabled: third-party cloud sync (WebDAV, S3-compatible bucket, Google Drive, OneDrive, iCloud Drive), per-chapter read-aloud audio download, Audiobookshelf offline downloads, trusted-device pairing, and custom translators with your own API key.

          Still decided by the upstream service, not unlockable in a client build: Readest Cloud storage quota, daily AI translation quota, and the Send-to-Readest email address.

          Two Android families are published: Readest_${VERSION}_universal.apk and _arm64.apk replace the official app (same application id, keeps your library), while Readest_${VERSION}_coexist-universal.apk and _coexist-arm64.apk install alongside it (com.hirofumo.readest.unlocked, labelled Readest Unlocked, empty library).

          In-app updates come from this repository: latest.json for the desktop builds and the replacing Android family, latest-coexist.json for the coexisting family.

          Readest is AGPL-3.0. These installers are unmodified upstream code plus the patch scripts in this repository. They are not code-signed by a certificate, so Windows SmartScreen and macOS Gatekeeper will warn on first launch."

          gh release create "$TAG" \
            --title "Readest $VERSION (unlocked build)" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"

  # ---------------------------------------------------------------------------
  # Desktop: one matrix leg per platform. Each leg checks upstream out, patches
  # it, builds and uploads its own artifacts plus their updater signatures.
  #
  # Android is a separate job because `matrix` is not a legal context in a
  # job-level `if` (it is evaluated before the matrix expands), and Android has
  # to be skipped outright when no signing secrets are configured.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.config.name }}
    needs: [detect, prepare]
    if: needs.detect.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows-latest
            name: windows-x86_64
            release: windows
            rust_targets: x86_64-pc-windows-msvc
            build_args: '--target x86_64-pc-windows-msvc --bundles nsis'
          - os: ubuntu-22.04
            name: linux-x86_64
            release: linux
            rust_targets: x86_64-unknown-linux-gnu
            build_args: '--bundles appimage,deb'
          - os: macos-latest
            name: macos-universal
            release: macos
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            # `app` is requested explicitly: the updater artifact is the .app
            # tarball, and asking for the dmg alone is not guaranteed to run the
            # app bundle target that produces it.
            build_args: '--target universal-apple-darwin --bundles app,dmg'
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 120
    permissions:
      contents: write
    # The updater private key signs every artifact that can be updated in place,
    # so `tauri build` needs it for all three platforms. Scoping it here keeps it
    # out of the earlier steps that run dependency lifecycle scripts.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    # Windows runners default to pwsh; every run script in this job is bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out upstream Readest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.ref }}

      - name: Initialize the submodules
        run: git submodule update --init --recursive

      - name: Check out the build recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .recipe

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.config.rust_targets }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: ${{ matrix.config.name }}-cargo

      # The npm cli-cef bundles the AppImage with a broken quick-sharun fork.
      # Build the CLI from readest/tauri instead; rev-pinned, and the marker
      # skips the rebuild while rust-cache keeps ~/.cargo/bin.
      - name: Install the CEF tauri CLI (Linux)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          rev=6beeb209b5514f597a26f48b7a5b9fe4c59b5f12
          marker="$HOME/.cargo/bin/.cargo-tauri-rev"
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ] && [ "$(cat "$marker" 2>/dev/null)" = "$rev" ]; then
            echo "cargo-tauri at $rev already installed"
            exit 0
          fi
          cargo install tauri-cli --git https://github.com/readest/tauri --rev "$rev" --locked --force
          echo "$rev" > "$marker"

      - name: Install Linux build dependencies (Linux)
        if: matrix.config.release == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # Chromium dlopens NSS, libpulse and libspeechd by soname; whatever the
      # bundle lacks comes from the host and breaks against the bundled glibc.
      # Stage them where the bundler picks them up.
      - name: Stage the CEF AppImage runtime libraries (Linux)
        if: matrix.config.release == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y libnss3 libpulse0 libspeechd2 libxkbcommon-x11-0
          nss_dir=$(dirname "$(ls /usr/lib/*-linux-gnu/nss/libsoftokn3.so)")
          lib_dir=${nss_dir%/nss}
          sudo cp -f --remove-destination "$nss_dir"/*.so "$lib_dir/"
          conf=apps/readest-app/src-tauri/tauri.conf.json
          jq --arg d "$lib_dir" '.bundle.linux.appimage.files += {
              "/usr/lib/libspeechd.so.2": ($d + "/libspeechd.so.2"),
              "/usr/lib/libxkbcommon-x11.so.0": ($d + "/libxkbcommon-x11.so.0")
            }' "$conf" > "$conf.tmp" && mv "$conf.tmp" "$conf"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply the unlock patch
        run: node .recipe/tools/unlock.mjs

      - name: Verify the patch (sources)
        run: node .recipe/tools/verify.mjs

      # Snapshot the patched tree. Some upstream build steps run `git checkout .`
      # to undo generated files; committing first makes that restore the patch
      # instead of reverting it.
      - name: Snapshot the patched tree
        run: |
          git config user.email "ci@readest-unlocked.invalid"
          git config user.name "readest-unlocked ci"
          # The recipe checkout sits inside this workspace; keep it out of the
          # snapshot commit so the diff stays the patch and nothing else.
          echo ".recipe/" >> .git/info/exclude
          git add -A
          git commit -m "chore: apply unlocked-build patch" --no-verify

      - name: Stage the pdf.js vendor assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # scripts/tauri.mjs runs `cargo tauri` (the CLI built above) and adds
          # --features cef on this platform.
          TAURI_CEF_CARGO: ${{ matrix.config.release == 'linux' && '1' || '0' }}
          STRACE_MODE: '0'
        run: |
          set -euo pipefail
          cd apps/readest-app
          pnpm tauri build ${{ matrix.config.build_args }}

      # The sources look right; prove the artifact is right too. Runs on the
      # `out/` tree the frontend build just produced.
      - name: Verify the patch (built bundle)
        run: node .recipe/tools/check-bundle.mjs

      # Stage the installer before the portable rebuild below: that rebuild
      # regenerates the same nsis output with NEXT_PUBLIC_PORTABLE_APP=true
      # baked into the frontend, and an installed app must not carry the
      # portable flag.
      - name: Stage the Windows installer
        if: matrix.config.release == 'windows'
        run: |
          set -euo pipefail
          nsis=target/x86_64-pc-windows-msvc/release/bundle/nsis
          cp "$(ls "$nsis"/*-setup.exe | head -n 1)" windows-setup.exe
          cp "$(ls "$nsis"/*-setup.exe.sig | head -n 1)" windows-setup.exe.sig

      - name: Build the portable executable (Windows)
        if: matrix.config.release == 'windows'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          cd apps/readest-app
          echo "NEXT_PUBLIC_PORTABLE_APP=true" >> .env.local
          pnpm tauri build ${{ matrix.config.build_args }}

      - name: Stage the Windows portable executable
        if: matrix.config.release == 'windows'
        run: cp target/x86_64-pc-windows-msvc/release/readest.exe windows-portable.exe

      - name: Upload the Windows artifacts
        if: matrix.config.release == 'windows'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          mv windows-setup.exe "Readest_${VERSION}_x64-setup.exe"
          mv windows-setup.exe.sig "Readest_${VERSION}_x64-setup.exe.sig"
          mv windows-portable.exe "Readest_${VERSION}_x64-portable.exe"
          # The portable exe is copied out of the target dir, so it carries no
          # signature of its own; sign it the way upstream signs its portable.
          (cd apps/readest-app && pnpm tauri signer sign "../../Readest_${VERSION}_x64-portable.exe")
          gh release upload "$TAG" \
            "Readest_${VERSION}_x64-setup.exe" \
            "Readest_${VERSION}_x64-setup.exe.sig" \
            "Readest_${VERSION}_x64-portable.exe" \
            "Readest_${VERSION}_x64-portable.exe.sig" \
            --clobber

      - name: Upload the macOS artifacts
        if: matrix.config.release == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          bundle=target/universal-apple-darwin/release/bundle
          cp "$(ls "$bundle"/dmg/*.dmg | head -n 1)" "Readest_${VERSION}_universal-unsigned.dmg"
          gh release upload "$TAG" "Readest_${VERSION}_universal-unsigned.dmg" --clobber

          # The macOS updater artifact is the .app tarball, not the dmg.
          tarball=$(ls "$bundle"/macos/*.app.tar.gz 2>/dev/null | head -n 1 || true)
          if [ -z "$tarball" ]; then
            echo "::warning::no .app.tar.gz updater archive was produced; macOS clients will not be offered updates"
            exit 0
          fi
          cp "$tarball" "Readest_${VERSION}_universal.app.tar.gz"
          cp "$tarball.sig" "Readest_${VERSION}_universal.app.tar.gz.sig"
          gh release upload "$TAG" \
            "Readest_${VERSION}_universal.app.tar.gz" \
            "Readest_${VERSION}_universal.app.tar.gz.sig" \
            --clobber

      - name: Upload the Linux artifacts
        if: matrix.config.release == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          bundle=target/release/bundle
          appimage=$(ls "$bundle"/appimage/*.AppImage | head -n 1)
          cp "$appimage" "Readest_${VERSION}_x86_64.AppImage"
          cp "$(ls "$bundle"/deb/*.deb | head -n 1)" "Readest_${VERSION}_x86_64.deb"
          gh release upload "$TAG" \
            "Readest_${VERSION}_x86_64.AppImage" \
            "Readest_${VERSION}_x86_64.deb" \
            --clobber

          # The Linux updater artifact is the AppImage itself, signed in place —
          # the app downloads it, chmods it and launches it. Upstream's manifest
          # points both linux-x86_64 and linux-x86_64-appimage at that asset.
          # Without its .sig the platform is simply left out of the manifest,
          # which the manifest job reports.
          if [ -f "$appimage.sig" ]; then
            cp "$appimage.sig" "Readest_${VERSION}_x86_64.AppImage.sig"
            gh release upload "$TAG" "Readest_${VERSION}_x86_64.AppImage.sig" --clobber
          else
            echo "::warning::no .sig next to the AppImage, so Linux clients will not be offered updates"
          fi

  # ---------------------------------------------------------------------------
  # Android: skipped outright until the signing secrets exist. Builds two
  # families — one that replaces the official app, one that installs beside it.
  # ---------------------------------------------------------------------------
  build_android:
    name: Build android
    needs: [detect, prepare]
    if: needs.detect.outputs.build == 'true' && needs.detect.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out upstream Readest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.detect.outputs.ref }}

      - name: Initialize the submodules
        run: git submodule update --init --recursive

      - name: Check out the build recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .recipe

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Install the Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: android-cargo

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply the unlock patch
        run: node .recipe/tools/unlock.mjs

      - name: Verify the patch (sources)
        run: node .recipe/tools/verify.mjs

      # `pnpm tauri android init` and `icon` dirty tracked files and upstream
      # undoes that with `git checkout .`; committing first makes that restore
      # the patch (and, for the second pass below, the coexist identity) instead
      # of reverting it.
      - name: Snapshot the patched tree
        run: |
          git config user.email "ci@readest-unlocked.invalid"
          git config user.name "readest-unlocked ci"
          echo ".recipe/" >> .git/info/exclude
          git add -A
          git commit -m "chore: apply unlocked-build patch" --no-verify

      - name: Stage the pdf.js vendor assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Initialize the Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          cd ../..
          bash .recipe/helpers/android-keystore.sh

      # Both android builds write the SAME output path: the plain build emits
      # every ABI, the -t aarch64 build overwrites it with an arm64-only APK.
      # Each one is staged under its own name before the next runs.
      - name: Build the replacing APKs
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          cd apps/readest-app
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          pnpm tauri android build
          cp "$apk" ../../android-replace-universal.apk
          pnpm tauri android build -t aarch64
          cp "$apk" ../../android-replace-arm64.apk

      - name: Verify the patch (built bundle)
        run: node .recipe/tools/check-bundle.mjs

      # Second family: same code, its own application id and label, so it can be
      # installed next to the official app instead of replacing it.
      - name: Switch to the coexisting identity
        run: |
          set -euo pipefail
          node .recipe/tools/coexist.mjs
          git add -A
          git commit -m "chore: switch to the coexisting Android identity" --no-verify

      - name: Initialize the coexisting Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          cd apps/readest-app
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .
          cd ../..
          bash .recipe/helpers/android-keystore.sh

      - name: Build the coexisting APKs
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          cd apps/readest-app
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          pnpm tauri android build
          cp "$apk" ../../android-coexist-universal.apk
          pnpm tauri android build -t aarch64
          cp "$apk" ../../android-coexist-arm64.apk

      - name: Upload the Android artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          mv android-replace-universal.apk "Readest_${VERSION}_universal.apk"
          mv android-replace-arm64.apk "Readest_${VERSION}_arm64.apk"
          mv android-coexist-universal.apk "Readest_${VERSION}_coexist-universal.apk"
          mv android-coexist-arm64.apk "Readest_${VERSION}_coexist-arm64.apk"

          if [ "$(stat -c %s "Readest_${VERSION}_universal.apk")" = "$(stat -c %s "Readest_${VERSION}_arm64.apk")" ]; then
            echo "::error::the universal and arm64 APKs are byte-identical; the staging order regressed"
            exit 1
          fi
          if [ "$(stat -c %s "Readest_${VERSION}_coexist-universal.apk")" = "$(stat -c %s "Readest_${VERSION}_coexist-arm64.apk")" ]; then
            echo "::error::the coexisting universal and arm64 APKs are byte-identical; the staging order regressed"
            exit 1
          fi

          # Tauri does not sign the APKs itself; upstream signs them explicitly
          # and so does this workflow, because the updater verifies them.
          cd apps/readest-app
          for apk in "Readest_${VERSION}_universal.apk" "Readest_${VERSION}_arm64.apk" \
                     "Readest_${VERSION}_coexist-universal.apk" "Readest_${VERSION}_coexist-arm64.apk"; do
            pnpm tauri signer sign "../../$apk"
          done
          cd ../..

          gh release upload "$TAG" \
            "Readest_${VERSION}_universal.apk" "Readest_${VERSION}_universal.apk.sig" \
            "Readest_${VERSION}_arm64.apk" "Readest_${VERSION}_arm64.apk.sig" \
            "Readest_${VERSION}_coexist-universal.apk" "Readest_${VERSION}_coexist-universal.apk.sig" \
            "Readest_${VERSION}_coexist-arm64.apk" "Readest_${VERSION}_coexist-arm64.apk.sig" \
            --clobber

  # ---------------------------------------------------------------------------
  # The app updates itself from these manifests, so they are assembled only once
  # every leg has uploaded its signatures. A manifest missing a platform key
  # means that platform is simply not offered an update, which the run summary
  # reports.
  # ---------------------------------------------------------------------------
  manifest:
    name: Publish updater manifests
    needs: [detect, build, build_android]
    if: needs.detect.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Download the signature files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p sigs
          gh release download "$TAG" --pattern '*.sig' --dir sigs --clobber
          ls -1 sigs

      - name: Build the manifests
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          node tools/make-manifest.mjs --dir sigs --version "$VERSION" --variant replace --out latest.json
          node tools/make-manifest.mjs --dir sigs --version "$VERSION" --variant coexist --out latest-coexist.json

      - name: Publish the manifests and the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          REF: ${{ needs.detect.outputs.ref }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" latest.json latest-coexist.json --clobber

          # The "recent updates" view reads this file; upstream's own copy is
          # versioned with the code, so serve that one.
          url="https://raw.githubusercontent.com/$UPSTREAM_REPO/$REF/apps/readest-app/release-notes.json"
          if curl -fsSL "$url" -o release-notes.json; then
            gh release upload "$TAG" release-notes.json --clobber
          else
            echo "::warning::could not fetch release-notes.json from $url"
          fi

  # ---------------------------------------------------------------------------
  summary:
    name: Summary
    needs: [detect, build, build_android, manifest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          BUILD: ${{ needs.detect.outputs.build }}
          DESKTOP: ${{ needs.build.result }}
          ANDROID: ${{ needs.build_android.result }}
          MANIFEST: ${{ needs.manifest.result }}
        run: |
          {
            echo "## Result"
            echo ""
            if [ "$BUILD" != "true" ]; then
              echo "Upstream has not published a new version since the last release; nothing was built."
            else
              echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
              echo ""
              echo "| leg | result |"
              echo "| --- | --- |"
              echo "| desktop matrix | $DESKTOP |"
              echo "| android | $ANDROID |"
              echo "| updater manifests | $MANIFEST |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
